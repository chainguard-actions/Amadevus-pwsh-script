name: Test PowerShell script error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -q
            apt-get install -y -q wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -q
            apt-get install -y -q powershell
          fi
          pwsh --version
      - id: action
        uses: .
        # continue-on-error so the workflow doesn't fail when the script throws
        continue-on-error: true
        with:
          script: |
            throw "intentional-test-error"
      - name: Assert error output is populated
        env:
          ACTUAL: ${{ steps.action.outputs.error }}
        run: |
          echo "actual error: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected error output to be non-empty"
            exit 1
          fi
          echo "PASS: error output is populated: $ACTUAL"
