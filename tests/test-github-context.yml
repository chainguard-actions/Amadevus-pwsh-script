name: Test GitHub context is available in script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -q
            apt-get install -y -q wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -q
            apt-get install -y -q powershell
          fi
          pwsh --version
      - id: action
        uses: .
        with:
          script: |
            # Verify the $github context object is available and has expected properties
            if ($null -eq $github) {
              throw "github context is null"
            }
            if ($null -eq $github.repository) {
              throw "github.repository is null"
            }
            return $github.repository
      - name: Assert github context was accessible
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected github.repository to be non-empty"
            exit 1
          fi
          echo "PASS: github context accessible, repository=$ACTUAL"
      - name: Assert no error
        env:
          ACTUAL: ${{ steps.action.outputs.error }}
        run: |
          echo "actual error: $ACTUAL"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no error but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
