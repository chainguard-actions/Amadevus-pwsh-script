name: Test PowerShell script with github context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          apt-get update -qq 2>/dev/null || true
          apt-get install -y -qq wget apt-transport-https 2>/dev/null || true
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -O /tmp/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          apt-get update -qq
          apt-get install -y -qq powershell
          pwsh --version
      - id: action
        uses: .
        with:
          script: |
            # Access the github context object
            $eventName = $github.event_name
            Write-Host "Event name: $eventName"
            return $eventName
      - name: Assert github context event_name is accessible
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty event_name from github context"
            exit 1
          fi
          echo "PASS: github context event_name = $ACTUAL"
