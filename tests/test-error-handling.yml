name: Test PowerShell script error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure PowerShell is available
        run: |
          if ! command -v pwsh &>/dev/null; then
            echo "pwsh not found, installing PowerShell..."
            PWSH_VER="7.4.1"
            curl -sSL "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VER}/powershell-${PWSH_VER}-linux-x64.tar.gz" -o /tmp/pwsh.tar.gz
            mkdir -p /opt/microsoft/powershell/7
            tar -xzf /tmp/pwsh.tar.gz -C /opt/microsoft/powershell/7
            chmod +x /opt/microsoft/powershell/7/pwsh
            ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
          fi
          pwsh --version
          # Ensure RUNNER_TEMP is set for the action's TEMP env var
          if [ -z "$RUNNER_TEMP" ]; then
            mkdir -p /tmp/runner-temp
            echo "RUNNER_TEMP=/tmp/runner-temp" >> "$GITHUB_ENV"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          script: |
            throw "intentional-test-error"
      - name: Assert step failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: step failed as expected when script throws"
      - name: Assert error output is populated
        env:
          ERROR: ${{ steps.action.outputs.error }}
        run: |
          echo "error: $ERROR"
          if [ -z "$ERROR" ]; then
            echo "FAIL: expected error output to be populated when script throws"
            exit 1
          fi
          if echo "$ERROR" | grep -qi "intentional-test-error"; then
            echo "PASS: error output contains the thrown exception message"
          else
            echo "FAIL: error output does not contain expected message 'intentional-test-error', got: $ERROR"
            exit 1
          fi
