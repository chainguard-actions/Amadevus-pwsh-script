name: Test PowerShell script arithmetic and string operations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          if command -v pwsh &>/dev/null; then
            echo "pwsh already installed: $(pwsh --version)"
            exit 0
          fi
          # Install PowerShell via Microsoft package repository
          UBUNTU_VERSION=$(. /etc/os-release && echo "$VERSION_ID")
          wget -q "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          apt-get update -qq
          apt-get install -y -qq powershell
          pwsh --version
      - id: action
        uses: .
        with:
          script: |
            $sum = 40 + 2
            return "result-$sum"
      - name: Assert arithmetic result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "result-42" ]; then
            echo "FAIL: expected 'result-42' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
