name: Test basic PowerShell script execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -q
            apt-get install -y -q wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -q
            apt-get install -y -q powershell
          fi
          pwsh --version
      - id: action
        uses: .
        with:
          script: |
            return "hello-world"
      - name: Assert result output
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello-world" ]; then
            echo "FAIL: expected 'hello-world' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert no error output
        env:
          ACTUAL: ${{ steps.action.outputs.error }}
        run: |
          echo "actual error: $ACTUAL"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no error but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: no error as expected"
