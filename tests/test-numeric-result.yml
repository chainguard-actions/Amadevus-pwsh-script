name: Test PowerShell script with numeric result
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -q
            apt-get install -y -q wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -q
            apt-get install -y -q powershell
          fi
          pwsh --version
      - id: action
        uses: .
        with:
          script: |
            $a = 6
            $b = 7
            return $a * $b
      - name: Assert numeric result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "42" ]; then
            echo "FAIL: expected '42' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
