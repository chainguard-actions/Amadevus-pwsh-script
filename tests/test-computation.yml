name: Test PowerShell computation and result return
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y curl gnupg apt-transport-https
            curl -sSL https://packages.microsoft.com/keys/microsoft.asc | apt-key add -
            curl -sSL -o /tmp/packages-microsoft-prod.deb \
              "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" \
              || curl -sSL -o /tmp/packages-microsoft-prod.deb \
              "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb"
            dpkg -i /tmp/packages-microsoft-prod.deb
            apt-get update -qq
            apt-get install -y powershell
          fi
          pwsh --version
      - id: action
        uses: .
        with:
          script: |
            $a = 6
            $b = 7
            return ($a * $b).ToString()
      - name: Assert computation result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "42" ]; then
            echo "FAIL: expected '42', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
