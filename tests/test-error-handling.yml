name: Test PowerShell script error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          if command -v pwsh &>/dev/null; then
            echo "pwsh already installed: $(pwsh --version)"
            exit 0
          fi
          # Install PowerShell via Microsoft package repository
          UBUNTU_VERSION=$(. /etc/os-release && echo "$VERSION_ID")
          wget -q "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          apt-get update -qq
          apt-get install -y -qq powershell
          pwsh --version
      - id: action
        uses: .
        continue-on-error: true
        with:
          script: |
            throw "intentional test error"
      - name: Assert action failed on script error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when script throws, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when script threw an exception"
