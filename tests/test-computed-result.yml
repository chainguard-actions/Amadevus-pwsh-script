name: Test PowerShell script computed result
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          apt-get update -qq 2>/dev/null || true
          apt-get install -y -qq wget apt-transport-https 2>/dev/null || true
          wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -O /tmp/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          apt-get update -qq
          apt-get install -y -qq powershell
          pwsh --version
      - id: action
        uses: .
        with:
          script: |
            $a = 6
            $b = 7
            return $a * $b
      - name: Assert computed result output
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "42" ]; then
            echo "FAIL: expected '42', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
